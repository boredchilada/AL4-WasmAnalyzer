name: WasmAnalyzer
version: 4.7.0.1
description: >
  WebAssembly binary analysis service. Parses WASM modules to extract imports,
  exports, data section strings, and function signatures. Detects cryptomining,
  embedded JavaScript, HTML smuggling, and other malicious patterns.

accepts: executable/web/wasm
rejects: empty|metadata/.*

stage: CORE
category: Static Analysis

file_required: true
timeout: 120
disable_cache: false

enabled: true
is_external: false

config:
  max_decompile_size: 10485760
  extract_decompiled: true

heuristics:
  - heur_id: 1
    name: Cryptomining Function Names
    description: >
      WASM module contains function names or imports associated with cryptocurrency
      mining algorithms such as CryptoNight, RandomX, or hash functions commonly
      used in browser-based miners.
    filetype: ".*"
    score: 1000
    attack_id:
      - T1496

  - heur_id: 2
    name: Embedded JavaScript or HTML
    description: >
      WASM data section contains embedded JavaScript or HTML code. This is a
      common evasion technique where malicious scripts are hidden inside WASM
      binaries to bypass text-based scanners.
    filetype: ".*"
    score: 500
    attack_id:
      - T1027.013

  - heur_id: 3
    name: Mining Pool Addresses
    description: >
      WASM data section contains strings matching known mining pool domains
      or stratum protocol URIs, indicating cryptocurrency mining activity.
    filetype: ".*"
    score: 1000
    attack_id:
      - T1496

  - heur_id: 4
    name: HTML Smuggling Pattern
    description: >
      WASM module contains patterns consistent with HTML smuggling such as
      base64 payload assembly, Blob creation, or download triggering.
    filetype: ".*"
    score: 500
    attack_id:
      - T1027.006

  - heur_id: 5
    name: Suspicious Imports
    description: >
      WASM module imports functions associated with suspicious activity such as
      timing APIs, WebSocket creation, or worker spawning.
    filetype: ".*"
    score: 250
    attack_id:
      - T1059

  - heur_id: 6
    name: Heavy Crypto Operations
    description: >
      WASM code section contains a high density of XOR, shift, and rotate
      operations characteristic of cryptographic hash algorithms.
    filetype: ".*"
    score: 300
    attack_id:
      - T1027

  - heur_id: 7
    name: Excessive Memory Allocation
    description: >
      WASM module requests an unusually large amount of memory, which is
      characteristic of cryptomining scratchpads or data exfiltration buffers.
    filetype: ".*"
    score: 100
    attack_id:
      - T1496

  - heur_id: 8
    name: Suspicious Data Section Strings
    description: >
      WASM data section contains URLs, IP addresses, or other IOCs that may
      indicate C2 communication or data exfiltration endpoints.
    filetype: ".*"
    score: 250
    attack_id:
      - T1027

docker_config:
  allow_internet_access: false
  image: ghcr.io/boredchilada/al4-wasmanalyzer:4.7.0.1
  cpu_cores: 1.0
  ram_mb: 2048
